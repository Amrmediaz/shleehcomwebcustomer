<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShleehCom — Buildings & Chalets Booking</title>
    <meta name="description" content="Book flats, apartments and chalets across Oman with ShleehCom." />
    <meta name="theme-color" content="#5850FF" />
    <!-- %BASE_URL% is Vite's built-in HTML replacement for the `base` config
         (see vite.config.js) — resolves to /app/ so these keep working now
         that the site is deployed under a subpath instead of domain root. -->
    <link rel="icon" type="image/png" href="%BASE_URL%favicon-32.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ShleehCom" />

    <!-- IBM Plex Sans / IBM Plex Sans Arabic: closest professionally-licensed,
         freely web-embeddable match to the app's actual "FF Shamel" typeface
         (a paid commercial font we can't legally ship on a public website
         without confirming its license covers web embedding). Same type
         family across both scripts keeps EN/AR switching visually consistent. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
